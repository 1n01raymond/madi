<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MADI — Open engineering for the Web</title>
  <desc id="desc">MADI wordmark beside an abstract wireframe engineering assembly.</desc>
  <defs>
